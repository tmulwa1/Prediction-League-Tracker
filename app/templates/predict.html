<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
    </head>

    <body>
        <h1>{{ event.name }}</h1>

        <form method="POST" class="predict-form">
            {% if event.sport == 'F1' %}
            <label for="predicted_winner">Predicted Winner</label><br>
            <input type="text" name="predicted_winner" placeholder="Enter the predicted winner">
            <br><br>

            <label for="predicted_podium">Predicted Podium</label><br>
            <input type="text" name="predicted_podium" placeholder="Enter the predicted podium">
            <br><br>

        {% else %}
            <label for="predicted_home_score">Predicted Home Score</label><br>
            <input type="number" name="predicted_home_score" placeholder="Enter the predicted home score">
            <br><br>

            <label for="predicted_away_score">Predicted Away Score</label><br>
            <input type="number" name="predicted_away_score" placeholder="Enter the predicted away score">
            <br><br>

        {% endif %}

            <button type="submit">Submit</button>
        </form>
    </body>
</html>
