<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Prediction Page</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>
        <div class="page">
            <h1>{{ event.name }}</h1>
            <p class="page-subtitle">{{ event.sport }} - Predictions close {{ event.lock_time.strftime('%a %d %b, %H:%M') }}</p>

            {% if prediction %}
            <div class="existing-prediction-note">
                You've already predicted this event - submitting again will update your prediction
            </div>
            {% endif %}

            <div class="form-card">
                <form method="POST" class="predict-form">

                {% if event.sport == 'F1' %}
                <div class="form-group">
                    <label for="predicted_winner">Predicted Winner</label><br>
                    <select name="predicted_winner">
                        {% for driver in drivers %}
                        <option value="{{ driver }}" {% if prediction and prediction.predicted_winner == driver %}selected{% endif %}>{{ driver }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Predicted Podium</label>
                    <div class="podium-row">
                        <select name="podium_1">
                            {% for driver in drivers %}
                            <option value="{{ driver }}">{{ driver }}</option>
                            {% endfor %}
                        </select>
        
                        <select name="podium_2">
                            {% for driver in drivers %}
                            <option value="{{ driver }}">{{ driver }}</option>
                            {% endfor %}
                        </select>

                        <select name="podium_3">
                            {% for driver in drivers %}
                            <option value="{{ driver }}">{{ driver }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                {% else %}
                <div class="form-group">
                    <label for="predicted_home_score">Predicted Home Score</label><br>
                    <input type="number" name="predicted_home_score" placeholder="Enter the predicted home score" step="1" min="0">
                </div>

                <div class="form-group">
                    <label for="predicted_away_score">Predicted Away Score</label><br>
                    <input type="number" name="predicted_away_score" placeholder="Enter the predicted away score" step="1" min="0">
                </div>
                {% endif %}

                    <button type="submit" class="btn-submit">{{ 'Update Prediction' if prediction else 'Submit Prediction' }}</button>
                </form>
            </div>
        </div>
    </body>
</html>
