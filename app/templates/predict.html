<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
    </head>

    <body>
        <h1>{{ event.name }}</h1>

        <form method="POST" class="predict-form">

            {% if event.sport == 'F1' %}
            <label for="predicted_winner">Predicted Winner</label><br>
            <select name="predicted_winner">
                {% for driver in drivers %}
                <option value="{{ driver }}">{{ driver }}</option>
                {% endfor %}
            </select>
            <br><br>

            <label>1st Place</label><br>
            <select name="podium_1">
                {% for driver in drivers %}
                <option value="{{ driver }}">{{ driver }}</option>
                {% endfor %}
            </select>
            <br>

            <label>2nd Place</label><br>
            <select name="podium_2">
                {% for driver in drivers %}
                <option value="{{ driver }}">{{ driver }}</option>
                {% endfor %}
            </select>
            <br>

            <label>3rd Place</label><br>
            <select name="podium_3">
                {% for driver in drivers %}
                <option value="{{ driver }}">{{ driver }}</option>
                {% endfor %}
            </select>
            <br><br>

        {% else %}
            <label for="predicted_home_score">Predicted Home Score</label><br>
            <input type="number" name="predicted_home_score" placeholder="Enter the predicted home score" step="1" min="0">
            <br><br>

            <label for="predicted_away_score">Predicted Away Score</label><br>
            <input type="number" name="predicted_away_score" placeholder="Enter the predicted away score" step="1" min="0">
            <br><br>

        {% endif %}

            <button type="submit">Submit</button>
        </form>
    </body>
</html>
