<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Leaderboard</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    
    <body>
        <header class="page-header">
            <h1>Leaderboard</h1>
        </header>

        <div class="leaderboard-list">
            {% for entry in leaderboard_data %}
            <div class="leaderboard-row {% if loop.index <= 3 %}leaderboard-row--top{{ loop.index }}{% endif %}">
                <span class="rank-badge {% if loop.index <= 3 %}rank-badge--top{{ loop.index }}{% endif %}">{{ loop.index }}</span>
                <span class="entry-name">{{ entry.username }}</span>
                <span class="entry-points">{{ entry.points }} pts</span>
            </div>
            {% endfor %}
        </div>
    </body>
</html>
